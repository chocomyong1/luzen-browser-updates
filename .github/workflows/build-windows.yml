name: Build Luzen Browser Windows update

on:
  push:
    branches: [main]
    paths:
      - 'AppSource/**'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-binary:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test repost identity and submission safety (offline)
        shell: pwsh
        run: |
          node tests/test_owned_list_repost_mock.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Owned-list repost test failed' }
          node tests/test_listing_identity.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Listing identity test failed' }
          node tests/test_js_syntax.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Embedded JS test failed' }
          node tests/test_repost_fallback_guards.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Repost fallback guard test failed' }
          node tests/test_my_listings_import_mock.cjs
          if ($LASTEXITCODE -ne 0) { throw 'My registered listings import test failed' }
          node tests/test_detail_fields_mock.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Detail-field extraction test failed' }
      - name: Restore assets from the existing verified v22.1 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://raw.githubusercontent.com/chocomyong1/luzen-browser-updates/main/releases/v22.1.0/LuzenBrowser_22.1.0_BinaryUpdate.zip'
          Invoke-WebRequest -Uri $url -OutFile existing-release.zip
          $expected = '7038fb9052d288f9564444b39cfaed7110601f91921e23265e56d54a54df93ea'
          $actual = (Get-FileHash existing-release.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Existing release archive failed SHA-256 integrity check.' }
          Expand-Archive -Path existing-release.zip -DestinationPath existing-release
          if (-not (Test-Path 'existing-release/Published/Assets/iBook1.ico')) { throw 'Existing release assets are missing.' }
          Copy-Item -Path 'existing-release/Published/Assets' -Destination 'AppSource/Assets' -Recurse
          Copy-Item -Path 'existing-release/Published/Config' -Destination 'AppSource/Config' -Recurse
      - name: Build application
        shell: pwsh
        run: |
          dotnet publish AppSource/LuzenBrowserReplica.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:DebugSymbols=false -p:DebugType=None -o Published
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if (-not (Test-Path 'Published/LuzenBrowserReplica.exe')) { throw 'EXE missing' }
          if (-not (Test-Path 'Published/Assets')) { throw 'Assets missing' }
          Get-ChildItem -Path Published -Recurse -File -Filter '*.pdb' | Remove-Item -Force
      - name: Package binary-only update
        shell: pwsh
        run: |
          $version = '22.2.10'
          Compress-Archive -Path 'Published' -DestinationPath "LuzenBrowser_${version}_BinaryUpdate.zip" -CompressionLevel Optimal
          $digest = (Get-FileHash -Path "LuzenBrowser_${version}_BinaryUpdate.zip" -Algorithm SHA256).Hash
          Write-Host "Windows binary ZIP SHA-256: $digest"
      - name: Keep build artifact private
        uses: actions/upload-artifact@v4
        with:
          name: luzen-browser-windows-v22.2.10
          path: LuzenBrowser_22.2.10_BinaryUpdate.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified binary to existing automatic update channel
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '22.2.10'
          $fileName = "LuzenBrowser_${version}_BinaryUpdate.zip"
          $releaseDir = "releases/v${version}"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item $fileName "$releaseDir/$fileName"
          $digest = (Get-FileHash "$releaseDir/$fileName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            version = $version
            packageUrl = "https://raw.githubusercontent.com/chocomyong1/luzen-browser-updates/main/$releaseDir/$fileName"
            sha256 = $digest
            format = 'binary'
            releaseNotes = 'v22.2.10: 본인 등록글 목록에서 번호/거래방향/제목/가격이 확인된 기존 글의 불필요한 보류를 자동 해제. 예전 상세 URL이 없거나 변경되어도 보류가 유지되는 오류 수정. 재등록 이전 제출 결과가 불명확한 글도 직접 사이트 확인 후 1건만 재시도하는 안내창 제공. 한 번 확인한 글은 이중 확인창 없이 1건 실행, 자동 반복은 꺼진 상태 유지. 실제 이전 제출 여부가 확인되지 않은 글은 자동 해제하지 않음. 오프라인 검증 완료, 실사이트 1건 확인 필요.'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path latest.json -Encoding utf8
          git config user.name 'luzen-auto-release'
          git config user.email 'luzen-auto-release@users.noreply.github.com'
          git add -- latest.json "$releaseDir/$fileName"
          git commit -m "Publish verified automatic update v${version}"
          git push origin HEAD:main

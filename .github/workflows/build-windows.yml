name: Build VANTA Windows update

on:
  push:
    branches: [main]
    paths:
      - 'AppSource/**'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main]
    paths:
      - 'AppSource/**'
      - 'tests/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser test tools
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Verify actual Chromium keyboard events and title protection offline
        run: node tests/test_native_keyboard_price_browser.cjs
  windows-binary:
    needs: browser-input
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test repost identity and submission safety (offline)
        shell: pwsh
        run: |
          node tests/test_owned_list_repost_mock.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Owned-list repost test failed' }
          node tests/test_listing_identity.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Listing identity test failed' }
          node tests/test_js_syntax.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Embedded JS test failed' }
          node tests/test_repost_fallback_guards.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Repost fallback guard test failed' }
          node tests/test_my_listings_import_mock.cjs
          if ($LASTEXITCODE -ne 0) { throw 'My registered listings import test failed' }
          node tests/test_stale_listing_cleanup.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Verified stale listing cleanup safety test failed' }
          node tests/test_detail_fields_mock.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Detail-field extraction test failed' }
          node tests/test_market_price_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Market-price and editor UI guards failed' }
          node tests/test_status_display.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Status display regression test failed' }
          node tests/test_table_simplification.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Product table simplification regression test failed' }
          node tests/test_hourly_quota_wiring.cjs
          if ($LASTEXITCODE -ne 0) { throw 'ID/server quota scheduler wiring test failed' }
          node tests/test_error_log_copy_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic log copy UI test failed' }
          node tests/test_login_navigation_race.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Login navigation race test failed' }
          node tests/test_repost_login_expiry_recovery.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Expired login during repost recovery test failed' }
          node tests/test_live_batch_edit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Live batch edit safety test failed' }
          node tests/test_site_price_edit_mock.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Site price update safety test failed' }
          node tests/test_price_id_only_site_title.cjs
          if ($LASTEXITCODE -ne 0) { throw 'ID-only price target and current site title preservation test failed' }
          node tests/test_site_submit_bindings_readonly.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Read-only actual-site submit event inspection test failed' }
          node tests/test_site_submit_validator_source_readonly.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Read-only first-party submit validator inspection test failed' }
          node tests/test_site_price_async_flow.cjs
          if ($LASTEXITCODE -ne 0) { throw 'First-party asynchronous price-submit flow safety test failed' }
          node tests/test_immediate_single_price_button.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Immediate one-listing site price action failed' }
          node tests/test_first_party_price_form_preflight.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Original FormChecker preflight and target-price validation failed' }
          node tests/test_held_price_reconciliation.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Held price reconciliation guard failed' }
          node tests/test_native_single_price_gate.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Native single-item price pilot safety test failed' }
          node tests/test_title_integrity_interlock.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Title integrity and disabled price POST test failed' }
          node tests/test_site_price_readback_safety.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Pending site price readback safety test failed' }
          node tests/test_site_price_batch_safety.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Deferred site price scheduling guard failed' }
          node tests/test_lifecycle_guards.cjs
          if ($LASTEXITCODE -ne 0) { throw 'New-listing/repost/price lifecycle test failed' }
          node tests/test_one_click_price_apply.cjs
          if ($LASTEXITCODE -ne 0) { throw 'One-click price apply safety test failed' }
          node tests/test_new_listing_preflight_mock.cjs
          if ($LASTEXITCODE -ne 0) { throw 'New sale/buy submission preflight mock failed' }
          node tests/test_apple_style_layout.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Apple-inspired layout regression test failed' }
          node tests/test_vanta_brand.cjs
          if ($LASTEXITCODE -ne 0) { throw 'VANTA brand/update compatibility test failed' }
          node tests/test_integrated_dark_grid.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Integrated table contrast regression test failed' }
          node tests/test_dark_scrollbars.cjs
          if ($LASTEXITCODE -ne 0) { throw 'VANTA native dark scrollbar regression test failed' }
          node tests/test_market_analysis_bridge.cjs
          if ($LASTEXITCODE -ne 0) { throw 'VANTA market analysis bridge isolation test failed' }
          node tests/test_market_price_advisor.cjs
          if ($LASTEXITCODE -ne 0) { throw 'VANTA market price recommendation approval safety test failed' }
          node tests/test_listing_grid_sort.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Server and numeric-price header sort test failed' }
          node tests/test_site_request_trace_safety.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Passive site request recording safety test failed' }
          node tests/test_price_submission_checkpoint_and_stages.cjs
          if ($LASTEXITCODE -ne 0) { throw 'One-item price click checkpoint and first-party stage diagnosis safety test failed' }
          node tests/test_disabled_price_reservation_cleanup.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Unsubmitted price reservation cancellation and safe review-hold guard failed' }
          node tests/test_dual_system_isolation.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Dual system isolation safety test failed' }
          node tests/test_menu_layout.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Menu layout regression test failed' }
          node tests/test_compact_scheduler_controls.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Compact scheduler control test failed' }
          node tests/test_auto_b_connect.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Automatic B proxy verification test failed' }
          node tests/test_tri_system_routes.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Three independent profiles and IP routes test failed' }
          node tests/test_split_dual_start.cjs
          if ($LASTEXITCODE -ne 0) { throw 'A+B simultaneous start and split-view guard test failed' }
          node tests/test_b_vpn_navigation_recovery.cjs
          if ($LASTEXITCODE -ne 0) { throw 'B VPN navigation recovery safety test failed' }
          node tests/test_owned_list_recovery_guard.cjs
          if ($LASTEXITCODE -ne 0) { throw 'A/B/C managed-list recovery guard test failed' }
          node tests/test_integrated_abc_edit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Combined A/B/C editing safety test failed' }
          node tests/test_pending_price_reedit.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Pending site-price re-edit and safe restart regression test failed' }
          node tests/test_price_reservations_ui.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Price reservation status and ETA UI test failed' }
          node tests/test_batch_edit_undo_safety.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Title, price reservation and local undo safety test failed' }
          node tests/test_warp_boot_guard.cjs
          if ($LASTEXITCODE -ne 0) { throw 'B Cloudflare local-proxy boot safety test failed' }
          node tests/test_vpn_runtime_telegram_status.cjs
          if ($LASTEXITCODE -ne 0) { throw 'B runtime VPN repair / Telegram remote status test failed' }
          node tests/test_windows_boot_autoreg.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows login autostart and A/B scheduler safety test failed' }
          node tests/test_telegram_unexpected_stop.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Telegram unexpected-stop notifications test failed' }
          node tests/test_telegram_channel_status_recovery.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Separate channel/private status and delayed alerts test failed' }
          node tests/test_b_login_dom_stability.cjs
          if ($LASTEXITCODE -ne 0) { throw 'B login redirect and owned-list DOM readiness safety test failed' }
          node tests/test_site_audit_backup_safety.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Missed-site-post audit and safe backup/restore test failed' }
          node tests/test_my_listings_progress.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Always-visible site-owned listings import progress test failed' }
          dotnet run --project tests/QuotaTests/QuotaTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Hourly quota logic test failed' }
          dotnet run --project tests/ImportSyncTests/ImportSyncTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Verified site price refresh test failed' }
          dotnet run --project tests/MarketBridgeTests/MarketBridgeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Authenticated local market bridge test failed' }
          dotnet run --project tests/MarketAdvisorTests/MarketAdvisorTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Conservative market price recommendation safety test failed' }
      - name: Restore assets from the existing verified v22.1 release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://raw.githubusercontent.com/chocomyong1/luzen-browser-updates/main/releases/v22.1.0/LuzenBrowser_22.1.0_BinaryUpdate.zip'
          $expected = '7038fb9052d288f9564444b39cfaed7110601f91921e23265e56d54a54df93ea'
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile existing-release.zip -TimeoutSec 90
              $actual = (Get-FileHash existing-release.zip -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actual -ne $expected) { throw 'Existing release archive failed SHA-256 integrity check.' }
              break
            }
            catch {
              if ($attempt -eq 6) { throw }
              Write-Host "Asset download retry $attempt/6: $($_.Exception.GetType().Name)"
              Start-Sleep -Seconds ([Math]::Min(5 * $attempt, 20))
            }
          }
          Expand-Archive -Path existing-release.zip -DestinationPath existing-release
          if (-not (Test-Path 'existing-release/Published/Assets/iBook1.ico')) { throw 'Existing release assets are missing.' }
          New-Item -ItemType Directory -Path 'AppSource/Assets' -Force | Out-Null
          Copy-Item -Path 'existing-release/Published/Assets/*' -Destination 'AppSource/Assets' -Recurse -Force
          Copy-Item -Path 'existing-release/Published/Config' -Destination 'AppSource/Config' -Recurse
      - name: Build application
        shell: pwsh
        run: |
          dotnet publish AppSource/LuzenBrowserReplica.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:DebugSymbols=false -p:DebugType=None -o Published
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed' }
          if (-not (Test-Path 'Published/LuzenBrowserReplica.exe')) { throw 'EXE missing' }
          if (-not (Test-Path 'Published/Assets')) { throw 'Assets missing' }
          Get-ChildItem -Path Published -Recurse -File -Filter '*.pdb' | Remove-Item -Force
      - name: Package binary-only update
        shell: pwsh
        run: |
          $version = '22.3.24'
          Compress-Archive -Path 'Published' -DestinationPath "LuzenBrowser_${version}_BinaryUpdate.zip" -CompressionLevel Optimal
          $digest = (Get-FileHash -Path "LuzenBrowser_${version}_BinaryUpdate.zip" -Algorithm SHA256).Hash
          Write-Host "Windows binary ZIP SHA-256: $digest"
      - name: Keep build artifact private
        uses: actions/upload-artifact@v4
        with:
          name: vanta-windows-v22.3.24
          path: LuzenBrowser_22.3.24_BinaryUpdate.zip
          if-no-files-found: error
          retention-days: 7
      - name: Publish verified binary to existing automatic update channel
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '22.3.24'
          $fileName = "LuzenBrowser_${version}_BinaryUpdate.zip"
          $releaseDir = "releases/v${version}"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item $fileName "$releaseDir/$fileName"
          $digest = (Get-FileHash "$releaseDir/$fileName" -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            schema = 1
            version = $version
            packageUrl = "https://raw.githubusercontent.com/chocomyong1/luzen-browser-updates/main/$releaseDir/$fileName"
            sha256 = $digest
            format = 'binary'
            releaseNotes = 'v22.3.24 아이템매니아 구매글 단건 가격 수정에서 사이트 FormChecker의 수량 범위·분할단위·최소 구매금액·캐릭터명·제목 허용문자 등 필수 조건을 실제 사이트 스크립트 기준으로 사전 검사합니다. 가격 입력 후에도 다시 검사해 제출 불가능한 상태에서는 클릭하거나 확인 필요로 보류하지 않고 구체적인 원인을 알립니다. 등록글 대상 식별은 등록번호 기준이며 제목 내용은 매칭에 사용하지 않습니다. 실제 제출 결과가 불확실한 경우 중복 방지 보류는 유지합니다.'
          }
          $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path latest.json -Encoding utf8
          git config user.name 'luzen-auto-release'
          git config user.email 'luzen-auto-release@users.noreply.github.com'
          git add -- latest.json "$releaseDir/$fileName"
          git commit -m "Publish verified automatic update v${version}"
          git push origin HEAD:main
